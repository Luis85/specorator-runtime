[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specorator-runtime"
version = "0.1.0"
description = "Request/response runtime and LLM orchestrator for autonomous agents"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["specorator_runtime"]
